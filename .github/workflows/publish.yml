name: Publish to npm

# 免 token 发布（npm trusted publishing / OIDC）
# 前置：在 npmjs.com 该包 Settings → Trusted Publishing 里配置
#   Publisher: GitHub Actions | Organization: AvatarGaia | Repository: canvas-mcp | Workflow: publish.yml
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包不发布'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC，npm 用它与 npmjs 交换发布凭证

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Show version
        run: node -p "require('./package.json').name + '@' + require('./package.json').version"

      - name: Pack (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm pack --dry-run

      - name: Publish
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public
