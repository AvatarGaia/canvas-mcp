name: Publish to npm

# 免 token 发布（npm trusted publishing / OIDC）
# 前置：npmjs.com 该包 Settings → Trusted Publishing 填 publisher：
#   GitHub Actions | Organization: AvatarGaia | Repository: canvas-mcp | Workflow: publish.yml
#
# ⚠️ 2026-09-13 踩坑记录：不要在 actions/setup-node 里设 registry-url ——
#    它会生成 .npmrc（//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}），
#    空 token 会**顶掉 OIDC**（npm 带着空 Bearer 去 PUT → 404 Not Found，
#    看起来像"没配 trusted publisher"，其实是 OIDC 没被用上）。
on:
  release:
    types: [published] # ← 正式发布**只**由 release tag 触发
  workflow_dispatch: # 手动触发：只做 OIDC 自检 + 打包 dry-run，不发布

permissions:
  contents: read
  id-token: write # OIDC：npm 用它与 registry 交换一次性发布凭证（无长期 token）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 注意：不传 registry-url（避免生成带空 _authToken 的 .npmrc）
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Remove any auth token config (让 npm 走 OIDC)
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG:-}" 2>/dev/null || true
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm config set registry https://registry.npmjs.org/
          npm config list | sed -E 's/(_authToken=).*/\1***/' || true

      - name: Show version
        run: node -p "require('./package.json').name + '@' + require('./package.json').version"

      - name: OIDC availability check
        run: |
          echo "OIDC request url set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo YES || echo NO)"
          node -v; npm -v

      # 手动触发 = 只打包，不发布
      - name: Pack only (manual / dry-run)
        if: github.event_name == 'workflow_dispatch'
        run: npm pack --dry-run

      # 仅 release 事件才真正发布
      - name: Publish (release only)
        if: github.event_name == 'release'
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish --access public
