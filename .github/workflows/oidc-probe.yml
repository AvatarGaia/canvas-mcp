name: OIDC Probe (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub OIDC token (audience = npm registry)
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" > /tmp/oidc.jwt
          echo "got OIDC token, length: ${#TOKEN}"
          python3 - <<'PY'
import base64, json
t = open('/tmp/oidc.jwt').read().strip()
payload = t.split('.')[1]
payload += '=' * (-len(payload) % 4)
d = json.loads(base64.urlsafe_b64decode(payload))
print('aud:', d.get('aud'))
print('iss:', d.get('iss'))
print('repository:', d.get('repository'))
print('workflow_ref:', d.get('workflow_ref'))
print('event_name:', d.get('event_name'))
PY

      - name: Exchange OIDC token at npm (see npm's answer)
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/oidc.jwt)
          PKG_ENC='%40avatargaia%2fcanvas-mcp'
          echo "--- POST /-/npm/v1/oidc/token/exchange/package/${PKG_ENC} ---"
          code=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PKG_ENC}")
          echo "HTTP $code"
          cat /tmp/exchange.json | head -c 600; echo
